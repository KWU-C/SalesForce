substitutions:
  _SERVICE_NAME: tcd-dashboard-dev
  _REGION: asia-northeast1

steps:
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - --source=dashboard
      - --region=${_REGION}
      - --set-env-vars=SALES_DATA_SOURCE=mock
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
