substitutions:
  _SERVICE_NAME: tcd-dashboard-dev
  _REGION: asia-northeast1
  # ファイル側のデフォルトは安全側のmock。実際にはdev/prod両トリガーとも
  # トリガー自体にSALES_DATA_SOURCE=salesforceが設定されており、そちらが
  # 優先される（2026-08-20確認・ユーザー方針確定。dev/prodとも実データ運用）。
  # このデフォルトは、トリガーを介さず手動でgcloud builds submitする場合の
  # 安全弁として残す。
  _SALES_DATA_SOURCE: mock
  # ダッシュボード独自メモ保存API(/api/process-memos)がIAP JWT検証に使う期待aud。
  # コードでは組み立てない（Cloud Runネイティブ統合時のaud書式は情報源により食い違いが
  # あり、自力で組み立てると誤った書式を検証に使うリスクがあるため）。Google Cloud
  # Console → セキュリティ → Identity-Aware Proxy → 対象Cloud Runサービスの行 → ⋮ →
  # 「Get JWT Audience Code」で取得した値を、dev/prodそれぞれのビルドトリガー側の
  # 置換変数として設定する（SALES_DATA_SOURCEと同じ運用）。未設定のままだと
  # メモ保存APIのみ常時403になる(fail-closed)。ダッシュボード本体の閲覧には影響しない。
  _IAP_EXPECTED_AUDIENCE: ""

steps:
  # 依存関係インストール（以降のstepはワークスペース共有のためnode_modulesを再利用）
  - id: install
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["ci"]

  # next build/devを一度も実行していないフレッシュチェックアウトでは
  # .next/types/(LayoutProps等のNext.js生成型)が存在せずtscが誤検出で
  # 失敗するため、型チェック前に型だけ先に生成する(フルビルドより高速)。
  - id: typegen
    name: node:22
    dir: dashboard
    entrypoint: npx
    args: ["next", "typegen"]

  # 型チェック・lint・テスト・ビルドのいずれかが失敗したらここで停止し、
  # 後続のdeploy stepは実行されない（Cloud Buildはstep失敗時に後続をスキップする）。
  # 直前のCloud Run revisionはそのままトラフィックを受け続けるため、
  # 壊れたコードが本番に出ることはない。
  - id: typecheck
    name: node:22
    dir: dashboard
    entrypoint: npx
    args: ["tsc", "--noEmit"]

  - id: lint
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["run", "lint"]

  - id: test
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["test"]

  - id: build
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["run", "build"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - --source=dashboard
      - --region=${_REGION}
      - --set-env-vars=SALES_DATA_SOURCE=${_SALES_DATA_SOURCE},SALESFORCE_LOGIN_URL=https://tcd-company.my.salesforce.com,SALESFORCE_USERNAME=sf-dashboard-integration@tcd.jp,IAP_EXPECTED_AUDIENCE=${_IAP_EXPECTED_AUDIENCE},FREEE_TOKEN_DOC_ID=${_SERVICE_NAME}
      - --set-secrets=SALESFORCE_CONSUMER_KEY=salesforce-consumer-key:latest,SALESFORCE_PRIVATE_KEY=salesforce-jwt-private-key:latest
      # freee連携用のFREEE_CLIENT_ID/FREEE_CLIENT_SECRETは、Secret Manager側に
      # freee-client-id/freee-client-secretシークレットを作成し、Cloud Runの
      # サービスアカウント(807402889038-compute@developer.gserviceaccount.com)に
      # secretAccessorを付与した後、ここに以下を追記する(ユーザー確定、2026-09-14。
      # 未作成のシークレットを参照するとdeploy stepがrevision作成に失敗するため、
      # 作成前にここへ追記しない):
      # --set-secrets=...,FREEE_CLIENT_ID=freee-client-id:latest,FREEE_CLIENT_SECRET=freee-client-secret:latest
      - --quiet

  # デプロイ後の稼働確認（ユーザー確定方針、2026-08-20）。
  # 1) 新revisionがReady状態か 2) URLがHTTP応答を返すか、を確認する。
  # このサービスはIAP保護下にあるため、未認証curlは200ではなく302/401/403等を
  # 返し得る。ここでは「応答があるか（5xx/接続不可でないか）」のみを見る
  # ゆるいチェックにしている（サーバークラッシュの検知が目的で、IAP認証の
  # 突破自体は目的ではない）。失敗時はビルドを失敗させ、Cloud Loggingに
  # 記録が残る（Secret・実データの値は一切出力しない）。
  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        svc="${_SERVICE_NAME}"
        region="${_REGION}"

        rev=$(gcloud run services describe "$svc" --region="$region" --format='value(status.latestReadyRevisionName)')
        if [ -z "$rev" ]; then
          echo "verify: no ready revision found for $svc"
          exit 1
        fi
        echo "verify: latest ready revision = $rev"

        rev_status=$(gcloud run revisions describe "$rev" --region="$region" --format='value(status.conditions[0].status)')
        if [ "$rev_status" != "True" ]; then
          echo "verify: revision $rev is not Ready (status=$rev_status)"
          exit 1
        fi
        echo "verify: revision $rev is Ready"

        url=$(gcloud run services describe "$svc" --region="$region" --format='value(status.url)')
        token=$(gcloud auth print-identity-token --audiences="$url" 2>/dev/null || echo "")
        if [ -n "$token" ]; then
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$url" || echo "000")
        else
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo "000")
        fi
        echo "verify: http status = $code"
        if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
          echo "verify: $svc did not respond healthily (http $code)"
          exit 1
        fi

        echo "verify: $svc ($url) deploy confirmed healthy, revision $rev"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
