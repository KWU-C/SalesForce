substitutions:
  _SERVICE_NAME: tcd-dashboard-dev
  _REGION: asia-northeast1
  # ファイル側のデフォルトは安全側のmock。実際にはdev/prod両トリガーとも
  # トリガー自体にSALES_DATA_SOURCE=salesforceが設定されており、そちらが
  # 優先される（2026-08-20確認・ユーザー方針確定。dev/prodとも実データ運用）。
  # このデフォルトは、トリガーを介さず手動でgcloud builds submitする場合の
  # 安全弁として残す。
  _SALES_DATA_SOURCE: mock
  # ダッシュボード独自メモ保存API(/api/process-memos)がIAP JWT検証に使う期待aud。
  # コードでは組み立てない（Cloud Runネイティブ統合時のaud書式は情報源により食い違いが
  # あり、自力で組み立てると誤った書式を検証に使うリスクがあるため）。Google Cloud
  # Console → セキュリティ → Identity-Aware Proxy → 対象Cloud Runサービスの行 → ⋮ →
  # 「Get JWT Audience Code」で取得した値を、dev/prodそれぞれのビルドトリガー側の
  # 置換変数として設定する（SALES_DATA_SOURCEと同じ運用）。未設定のままだと
  # メモ保存APIのみ常時403になる(fail-closed)。ダッシュボード本体の閲覧には影響しない。
  _IAP_EXPECTED_AUDIENCE: ""
  # 経営ダッシュボードの当月分スナップショットを毎日18:00(Asia/Tokyo)に自動更新する
  # Cloud Run Job(deploy-jobステップ参照)が、コンテナの実行アイデンティティとして
  # アタッチするサービスアカウント。IAPには一切関与せず、Firestore読み書き+freee
  # Secret参照のみを持つ最小権限SA(ユーザー確定、2026-09-18)。Cloud SchedulerがJobを
  # 起動するための別のサービスアカウント(roles/run.invokerのみ)とは完全に別物で、
  # そちらはこのcloudbuild.yamlには一切登場しない(Scheduler側の設定でのみ使う、
  # インフラ手順側で対応)。未設定(空文字)の場合はCloud Runのデフォルトコンピュート
  # SAで動く(fail-closedにはしない。Jobは公開エンドポイントを持たず、誤って空文字の
  # まま動いても外部からの攻撃面にはならないため)。dev/prodそれぞれのビルドトリガー
  # 側の置換変数として設定する(_IAP_EXPECTED_AUDIENCEと同じ運用)。
  _FREEE_JOB_SERVICE_ACCOUNT_EMAIL: ""

steps:
  # 依存関係インストール（以降のstepはワークスペース共有のためnode_modulesを再利用）
  - id: install
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["ci"]

  # next build/devを一度も実行していないフレッシュチェックアウトでは
  # .next/types/(LayoutProps等のNext.js生成型)が存在せずtscが誤検出で
  # 失敗するため、型チェック前に型だけ先に生成する(フルビルドより高速)。
  - id: typegen
    name: node:22
    dir: dashboard
    entrypoint: npx
    args: ["next", "typegen"]

  # 型チェック・lint・テスト・ビルドのいずれかが失敗したらここで停止し、
  # 後続のdeploy stepは実行されない（Cloud Buildはstep失敗時に後続をスキップする）。
  # 直前のCloud Run revisionはそのままトラフィックを受け続けるため、
  # 壊れたコードが本番に出ることはない。
  - id: typecheck
    name: node:22
    dir: dashboard
    entrypoint: npx
    args: ["tsc", "--noEmit"]

  - id: lint
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["run", "lint"]

  - id: test
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["test"]

  - id: build
    name: node:22
    dir: dashboard
    entrypoint: npm
    args: ["run", "build"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - --source=dashboard
      - --region=${_REGION}
      - --set-env-vars=SALES_DATA_SOURCE=${_SALES_DATA_SOURCE},SALESFORCE_LOGIN_URL=https://tcd-company.my.salesforce.com,SALESFORCE_USERNAME=sf-dashboard-integration@tcd.jp,IAP_EXPECTED_AUDIENCE=${_IAP_EXPECTED_AUDIENCE},FREEE_TOKEN_DOC_ID=${_SERVICE_NAME}
      - --set-secrets=SALESFORCE_CONSUMER_KEY=salesforce-consumer-key:latest,SALESFORCE_PRIVATE_KEY=salesforce-jwt-private-key:latest,FREEE_CLIENT_ID=freee-client-id:latest,FREEE_CLIENT_SECRET=freee-client-secret:latest
      - --quiet

  # 経営ダッシュボードの当月分スナップショットを毎日18:00(Asia/Tokyo)に自動更新する
  # Cloud Run Job。Webサービス(直前のdeployステップ)と全く同じソースイメージを使い、
  # 実行内容だけ上書きする(Web用は`npm start`のまま、Job用は
  # `node dist/jobs/scheduledFinanceRefresh.js`に分離、ユーザー確定、2026-09-18)。
  # dist/jobs/scheduledFinanceRefresh.jsは`npm run build`(=`next build && npm run
  # build:job`)がesbuildで生成する単一ファイルの事前コンパイル済みJSで、実行時に
  # tsx等のTypeScriptトランスパイラを一切必要としない(tsxはローカル動作確認用の
  # devDependencyのみに留める、ユーザー確定、2026-09-18)。
  #
  # 重要: --commandに汎用launcherバイナリを絶対パスで直接指定し、--argsで
  # `-- node dist/jobs/...js`を渡す(ユーザー確定、2026-09-18、実地の起動失敗3件を
  # 受けての修正。Docker Registry HTTP APIでイメージのconfig blobを直接取得し、
  # 実際のEntrypoint/Cmdを確認した上で特定した原因)。
  #
  # 失敗1(--command=nodeを指定): ENTRYPOINTを丸ごと置き換えてしまい、buildpacksが
  # 用意するPATH等の環境なしに生の"node"をexecしようとして即座に失敗
  # (Cloud Run上で「Application exec likely failed」、アプリログ0行で再現)。
  #
  # 失敗2(--commandを空にして--args=node,dist/jobs/...jsのみ): このイメージの実際の
  # ENTRYPOINTは汎用の`/cnb/lifecycle/launcher`ではなく`/cnb/process/web`という、
  # "web"プロセスタイプ専用の固定ショートカットだった(イメージのconfig blobで実測、
  # Google Cloud BuildpacksのNode.js実装がプロセスタイプ単一の場合にこの形にする)。
  # このショートカットは常に`npm start`(=`next start`)を実行し、渡された引数を
  # 単純に追加するだけで、「これは別コマンドだ」と解釈する`--`区切りの処理を持たない。
  # 実際`next start node dist/jobs/scheduledFinanceRefresh.js`として実行され、
  # nextが"node"をプロジェクトディレクトリ引数と誤認してエラーになる形で再現した。
  #
  # 修正: `--command=/cnb/lifecycle/launcher`で汎用launcherバイナリを絶対パス指定で
  # 直接exec対象にする(絶対パスなのでPATH未確立でも実行でき、起動後にlauncher自身が
  # buildpacksのレイヤー環境を組み立てる)。`--args=--,node,dist/jobs/...js`で、
  # launcherに「`--`以降は直接execする生のコマンド行」と解釈させる(CNB launcherの
  # 公式仕様、RFC 0045)。`/cnb/lifecycle/launcher`はPATH環境変数(イメージのconfig
  # blobで確認済み: `/cnb/process:/cnb/lifecycle:...`)にも含まれる実体バイナリ。
  #
  # Cloud Run Jobは受信用URLを持たず、Cloud Scheduler→Cloud Run Admin API(jobs.run)
  # 経由でのみ起動される。IAP・OAuth・Cloud Run IAM(run.invoker等)はWebサービス側の
  # 設定に一切触れない、別リソース・別IAM面(このJobを起動する権限は、下の
  # service-accountとは別のScheduler専用SAへ、Job単体スコープでrun.invokerとして
  # 個別に付与する。インフラ手順側で対応)。
  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        svc="${_SERVICE_NAME}"
        region="${_REGION}"
        job="${_SERVICE_NAME}-finance-refresh"

        image=$(gcloud run services describe "$svc" --region="$region" --format='value(spec.template.spec.containers[0].image)')
        echo "deploy-job: reusing image $image for $job"

        sa_args=()
        if [ -n "${_FREEE_JOB_SERVICE_ACCOUNT_EMAIL}" ]; then
          sa_args=(--service-account="${_FREEE_JOB_SERVICE_ACCOUNT_EMAIL}")
        fi

        gcloud run jobs deploy "$job" \
          --image="$image" \
          --region="$region" \
          --command=/cnb/lifecycle/launcher \
          --args=--,node,dist/jobs/scheduledFinanceRefresh.js \
          --set-env-vars=FREEE_TOKEN_DOC_ID=${_SERVICE_NAME} \
          --set-secrets=FREEE_CLIENT_ID=freee-client-id:latest,FREEE_CLIENT_SECRET=freee-client-secret:latest \
          --task-timeout=540s \
          --max-retries=1 \
          --tasks=1 \
          "${sa_args[@]}" \
          --quiet

        echo "deploy-job: $job deployed (trigger schedule is configured separately via Cloud Scheduler, not by this build)"

  # デプロイ後の稼働確認（ユーザー確定方針、2026-08-20）。
  # 1) 新revisionがReady状態か 2) URLがHTTP応答を返すか、を確認する。
  # このサービスはIAP保護下にあるため、未認証curlは200ではなく302/401/403等を
  # 返し得る。ここでは「応答があるか（5xx/接続不可でないか）」のみを見る
  # ゆるいチェックにしている（サーバークラッシュの検知が目的で、IAP認証の
  # 突破自体は目的ではない）。失敗時はビルドを失敗させ、Cloud Loggingに
  # 記録が残る（Secret・実データの値は一切出力しない）。
  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        svc="${_SERVICE_NAME}"
        region="${_REGION}"

        rev=$(gcloud run services describe "$svc" --region="$region" --format='value(status.latestReadyRevisionName)')
        if [ -z "$rev" ]; then
          echo "verify: no ready revision found for $svc"
          exit 1
        fi
        echo "verify: latest ready revision = $rev"

        rev_status=$(gcloud run revisions describe "$rev" --region="$region" --format='value(status.conditions[0].status)')
        if [ "$rev_status" != "True" ]; then
          echo "verify: revision $rev is not Ready (status=$rev_status)"
          exit 1
        fi
        echo "verify: revision $rev is Ready"

        url=$(gcloud run services describe "$svc" --region="$region" --format='value(status.url)')
        token=$(gcloud auth print-identity-token --audiences="$url" 2>/dev/null || echo "")
        if [ -n "$token" ]; then
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$url" || echo "000")
        else
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo "000")
        fi
        echo "verify: http status = $code"
        if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
          echo "verify: $svc did not respond healthily (http $code)"
          exit 1
        fi

        echo "verify: $svc ($url) deploy confirmed healthy, revision $rev"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
